name: Action Bundle 5 Finalize

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply final Bundle 5 hardening
        run: node scripts/finalize-action-bundle-5.mjs
      - name: Repair shared CSS after claim removal
        run: node scripts/fix-action-bundle-5-css.mjs
      - name: Persist finalized branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes required."
          else
            git commit -m "Harden and finalize Action Bundle 5"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused Bundle 5 tests
        run: node --experimental-strip-types --test tests/character-edit-mode.test.mjs tests/character-sharing-ui.test.mjs tests/character-actions.test.mjs
      - name: Full test suite
        run: npm test
