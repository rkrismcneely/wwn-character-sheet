name: Action Bundle 6 Final Polish

on:
  push:
    branches:
      - feat/action-bundle-6-campaign-items
    paths:
      - ".github/workflows/action-bundle-6-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/action-bundle-6-campaign-items
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply final polish
        run: |
          node scripts/action-bundle-6-polish.mjs
          rm scripts/action-bundle-6-polish.mjs
      - name: Persist polished branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Action Bundle 6 inventory behavior"
          git push origin HEAD:feat/action-bundle-6-campaign-items
