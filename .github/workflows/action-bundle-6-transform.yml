name: Action Bundle 6 Integrate

on:
  push:
    branches:
      - feat/action-bundle-6-campaign-items
    paths:
      - "scripts/action-bundle-6-transform.mjs"
      - "scripts/fix-action-bundle-6-transform.mjs"
      - ".github/workflows/action-bundle-6-transform.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/action-bundle-6-campaign-items
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply Bundle 6 integration
        run: |
          node scripts/fix-action-bundle-6-transform.mjs
          node scripts/action-bundle-6-transform.mjs
          rm -f scripts/fix-action-bundle-6-transform.mjs
      - name: Persist integrated branch
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Action Bundle 6 inventory system"
          git push origin HEAD:feat/action-bundle-6-campaign-items
