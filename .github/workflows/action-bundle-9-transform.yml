name: Action Bundle 9 Transform

on:
  push:
    branches:
      - feat/action-bundle-9-companion-map-tokens
    paths:
      - lib/campaigns/map.ts
      - lib/campaigns/map-companions.ts
      - app/api/campaigns/**/map/tokens/route.ts
      - app/campaigns/campaign-map-launcher.tsx
      - app/campaigns/campaign-map.css
      - drizzle/0021_action_bundle_9_companion_map_tokens.sql
      - scripts/migrate-campaign-map-foundation.mjs
      - .github/workflows/migrate-campaign-map-foundation.yml
      - .github/workflows/deploy-production.yml
      - tests/action-bundle-9-companion-map-tokens.test.mjs
      - scripts/action-bundle-9-transform.mjs
      - .github/workflows/action-bundle-9-transform.yml

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/action-bundle-9-companion-map-tokens
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply focused Bundle 9 transform
        run: node scripts/action-bundle-9-transform.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused tests
        run: node --experimental-strip-types --test tests/action-bundle-9-companion-map-tokens.test.mjs tests/campaign-map.test.mjs tests/campaign-map-interactions.test.mjs tests/beastmaster-companion.test.mjs
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate Worker artifact
        run: npm run validate:artifact
      - name: Commit transformed Bundle 9 files
        run: |
          if git diff --quiet; then
            echo "Bundle 9 files already transformed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/campaigns/map.ts \
            app/api/campaigns/[id]/map/tokens/route.ts \
            app/campaigns/campaign-map-launcher.tsx \
            app/campaigns/campaign-map.css \
            scripts/migrate-campaign-map-foundation.mjs \
            .github/workflows/migrate-campaign-map-foundation.yml \
            .github/workflows/deploy-production.yml
          git commit -m "Implement companion campaign map tokens"
          git pull --rebase origin feat/action-bundle-9-companion-map-tokens
          git push origin HEAD:feat/action-bundle-9-companion-map-tokens
