name: Apply Beastmaster fix

on:
  push:
    branches:
      - codex/beastmaster-bond-companion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Apply focused Beastmaster patches
        run: |
          python3 scripts/patch-beastmaster-creation.py
          python3 scripts/patch-beastmaster-wizard.py
          python3 scripts/patch-beastmaster-sheet.py

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/character-creation.ts app/character-creation-wizard.tsx app/character-sheet.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Beastmaster bond and companion sheet"
          git push
