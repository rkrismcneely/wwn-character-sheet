name: Apply Beastmaster legacy bond fix

on:
  push:
    branches:
      - codex/beastmaster-bond-companion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Apply legacy/default bond compatibility patch
        run: python3 scripts/patch-beastmaster-legacy-bond.py

      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/character-creation.ts
          git diff --cached --quiet && exit 0
          git commit -m "Default legacy Beastmasters to Bind Companion"
          git push
