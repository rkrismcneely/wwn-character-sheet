name: Apply Journal Ordering Migration 0033
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-journal-order-0033.yml"]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify production target and pending migration scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import {DATABASE_NAME,DATABASE_ID,operationMode,runWrangler,queryD1} from './scripts/d1-admin.mjs';
          process.argv.push('--remote', '--confirm-database-id='+DATABASE_ID);
          operationMode();
          const cols=queryD1("SELECT name FROM pragma_table_info('campaign_journal_entries') WHERE name='sort_order'",true);
          if(cols.length) throw new Error('Journal ordering column already exists; migration requires reconciliation before proceeding.');
          const output=runWrangler(['d1','migrations','list',DATABASE_NAME,'--remote','--config','wrangler.jsonc']);
          console.log(output);
          const matches=[...output.matchAll(/[0-9]{4}_[A-Za-z0-9_.-]+\.sql/g)].map(x=>x[0]);
          if(matches.length!==1 || !matches[0].startsWith('0033_campaign_journal_order.sql')) {
            throw new Error('Pending migration list is not limited to migration 0033; refusing to apply.');
          }
          EOF
      - name: Apply and verify pending migration 0033
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/migrate-production.mjs --remote --apply --confirm-database-id=8e2bf197-e20f-4ea7-a86f-cab4e1a74699
          node --input-type=module <<'EOF'
          import {DATABASE_NAME,DATABASE_ID,operationMode,queryD1} from './scripts/d1-admin.mjs';
          process.argv.push('--remote', '--confirm-database-id='+DATABASE_ID);
          operationMode();
          const column=queryD1("SELECT name FROM pragma_table_info('campaign_journal_entries') WHERE name='sort_order'",true);
          if(column.length!==1)throw new Error('Journal ordering column not found after migration');
          const index=queryD1("SELECT name FROM sqlite_master WHERE type='index' AND name='campaign_journal_sibling_order_idx'",true);
          if(index.length!==1)throw new Error('Journal ordering index not found after migration');
          console.log('Journal ordering migration verified on production D1.');
          EOF
