name: Apply verified Phase 4B sign-in fix v2

on:
  pull_request:
    branches:
      - phase-4b-better-auth

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4b-better-auth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Verify expected feature HEAD
        run: test "$(git rev-parse HEAD)" = "e8ee56ea17558757d9d07e5a1c83c0d4055bf5ea"
      - name: Apply verified local patch
        run: |
          echo '' | base64 -d > /tmp/phase4b-signin-fix.patch
          git apply --check /tmp/phase4b-signin-fix.patch
          git apply /tmp/phase4b-signin-fix.patch
          git diff --check
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build and validate artifact
        run: npm run build
      - name: Non-Worker tests
        run: node --experimental-strip-types --test tests/dice.test.mjs tests/phase4b-migration.test.mjs tests/phase4b-security.test.mjs tests/rules-search.test.mjs tests/srd-rules.test.mjs
      - name: Rendered Worker tests
        shell: bash
        run: |
          set -euo pipefail
          run_rendered() {
            local pattern="$1"
            local expected="$2"
            local log
            log="$(mktemp)"
            set +e
            timeout 55s node --experimental-strip-types --test --test-name-pattern="$pattern" tests/rendered-html.test.mjs 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            if grep -q '^not ok ' "$log"; then exit 1; fi
            grep -Fq "$expected" "$log"
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          }
          run_rendered 'local Worker renders' 'ok 1 - local Worker renders the signed-out UI and rejects protected writes'
          run_rendered 'local Worker signs out' 'ok 1 - local Worker signs out an authenticated session and reports the request'
      - name: Worker types
        run: npm run workers:types
      - name: Commit verified fix
        run: |
          git config user.name 'phase4b-runtime-fix'
          git config user.email 'phase4b-runtime-fix@users.noreply.github.com'
          git add app/page.tsx tests/phase4b-security.test.mjs docs/PHASE-4B-CHECKPOINT.md
          git commit -m 'Fix obscured Better Auth sign-in control'
          git push origin HEAD:phase-4b-better-auth
      - name: Remove temporary workflow branch
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "agent/phase-4b-apply-fix-v2" ]; then
            git push origin --delete "$HEAD_REF" || true
          fi
