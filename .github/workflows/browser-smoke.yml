name: Browser Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/browser-smoke.yml"
      - "playwright.smoke.config.mjs"
      - "scripts/start-browser-smoke-worker.mjs"
      - "tests/e2e/**"

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install browser test runner without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production Worker once
        run: npm run build

      - name: Run focused browser smoke suite
        run: npx playwright test --config=playwright.smoke.config.mjs

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/browser-smoke/
            test-results/browser-smoke/
          if-no-files-found: ignore
          retention-days: 3
