name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All substantive checks run concurrently. Validate is the single status gate.
# Push checks report direct-to-main failures; only a repository ruleset requiring
# Validate on pull requests can prevent unvalidated code reaching main.
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint -- --cache --cache-location .eslintcache

  source_tests:
    name: Source and migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select test impact
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/select-test-impact.mjs | tee /tmp/test-impact
          cat /tmp/test-impact >> "$GITHUB_OUTPUT"
          cat /tmp/test-impact >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run focused tests for changed components before full test suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/select-test-impact.mjs --audit --run
      - name: Run tests that do not need the compiled Worker
        shell: bash
        env:
          TEST_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          set -euo pipefail
          files=(tests/*.test.mjs)
          selected=()
          for file in "${files[@]}"; do
            if [ "$file" != tests/rendered-html.test.mjs ]; then selected+=("$file"); fi
          done
          if [ "$TEST_MODE" = appearance ]; then
            echo "Appearance-only changes: source tests are covered by scheduled full CI."
          else
            node --experimental-strip-types --test "${selected[@]}"
          fi

  build:
    name: Production build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select test impact
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/select-test-impact.mjs | tee /tmp/test-impact
          cat /tmp/test-impact >> "$GITHUB_OUTPUT"
          cat /tmp/test-impact >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build and run Worker integration tests
        shell: bash
        env:
          TEST_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          set -euo pipefail
          npm run build
          node --experimental-strip-types --test tests/rendered-html.test.mjs
      - name: Save tested production bundle
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: tested-worker-${{ github.event.pull_request.head.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, lint, source_tests, build]
    steps:
      - name: Require every CI check to pass
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
          SOURCE_TESTS: ${{ needs.source_tests.result }}
        run: |
          for result in "$TYPECHECK" "$LINT" "$SOURCE_TESTS" "$BUILD"; do
            if [ "$result" != success ]; then
              echo "One or more required CI checks failed or were skipped."
              exit 1
            fi
          done
