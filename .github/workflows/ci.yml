name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All substantive checks run concurrently. The Validate result remains the
# branch-protection gate and succeeds only when every required job succeeds.
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint -- --cache --cache-location .eslintcache

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The unit and regression suite does not require the production bundle.
      - run: node --experimental-strip-types --test tests/*.test.mjs

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # npm run build already validates the output artifact.
      - run: npm run build

  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, lint, tests, build]
    steps:
      - name: Require every CI check to pass
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for result in "$TYPECHECK" "$LINT" "$TESTS" "$BUILD"; do
            if [ "$result" != success ]; then
              echo "One or more required CI checks failed or were skipped."
              exit 1
            fi
          done
