name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All substantive checks run concurrently. The Validate result remains the
# branch-protection gate and succeeds only when every required job succeeds.
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint -- --cache --cache-location .eslintcache

  build:
    name: Production build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only explicitly allowlisted presentation-only changes get a reduced
      # test run. Any server, auth, schema, rules, test, or workflow edit runs
      # the complete suite. Dispatch and scheduled checks are always full.
      - name: Select safe test scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "fast=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != pull_request ] || [ -z "$BASE_SHA" ]; then
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD > /tmp/ci-changed-files
          if [ ! -s /tmp/ci-changed-files ]; then exit 0; fi
          while IFS= read -r file; do
            case "$file" in
              app/campaigns/campaign-map-*.tsx|app/campaigns/map-*.tsx|app/campaigns/campaign-map.css|app/campaigns/campaign-ui.css|app/globals.css|public/*|*.md|docs/*)
                ;;
              *)
                echo "Full suite required by: $file"
                exit 0
                ;;
            esac
          done < /tmp/ci-changed-files
          echo "fast=true" >> "$GITHUB_OUTPUT"
          echo "Presentation-only PR: use the routine test suite."
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Production build and tests
        shell: bash
        env:
          FAST_SUITE: ${{ steps.scope.outputs.fast }}
        run: |
          if [ "$FAST_SUITE" = true ]; then
            npm run build
            # Skip only the seven measured slow checks on allowlisted UI PRs.
            # Full runs still cover migration history, Worker authentication,
            # and the broad search benchmark.
            node --experimental-strip-types --test \
              --test-skip-pattern='Phase 4C campaign foundation is additive|existing character data remains readable and unchanged after Phase 4B migrations|Phase 4D migration is additive|local Worker renders the signed-out UI|local Worker enforces read-only administrator access|local Worker signs out an authenticated session|Rules Search Phase 4 broad benchmark meets Top-1 and Top-3 accuracy targets' \
              tests/*.test.mjs
          else
            npm test
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, lint, build]
    steps:
      - name: Require every CI check to pass
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for result in "$TYPECHECK" "$LINT" "$BUILD"; do
            if [ "$result" != success ]; then
              echo "One or more required CI checks failed or were skipped."
              exit 1
            fi
          done
