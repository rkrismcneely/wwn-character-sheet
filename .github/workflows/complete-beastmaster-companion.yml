name: Complete Beastmaster companion

on:
  push:
    branches:
      - fix/complete-beastmaster-companion

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-beastmaster-companion
          fetch-depth: 0

      - name: Apply Beastmaster completion
        run: python scripts/complete-beastmaster-companion.py

      - name: Verify implementation
        run: |
          npm ci
          npm run typecheck
          npm run lint
          node --experimental-strip-types --test tests/beastmaster-companion.test.mjs tests/level-one-creation-audit.test.mjs tests/level-advancement.test.mjs

      - name: Commit implementation
        run: |
          rm .github/workflows/complete-beastmaster-companion.yml scripts/complete-beastmaster-companion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Beastmaster companion support"
          git push origin HEAD:fix/complete-beastmaster-companion
