name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 2

      - name: Skip ordinary deploy for the feature migration release
        id: migration_guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff-tree --no-commit-id --name-only -r -m "${GITHUB_SHA}" | grep -Eq "^drizzle/(0008_campaign_resources|0009_character_campaign_lifecycle|0010_campaign_live_sessions)\\.sql$|^scripts/migrate-phase5a1-live-sessions\\.mjs$|^\\.github/workflows/migrate-phase5a1-live-sessions\\.yml$"; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "The feature migration workflow owns this release; ordinary deployment is skipped."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Node.js
        if: steps.migration_guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        if: steps.migration_guard.outputs.skip != 'true'
        run: npm ci

      - name: Build and validate production Worker
        if: steps.migration_guard.outputs.skip != 'true'
        run: npm run build

      - name: Deploy production Worker
        if: steps.migration_guard.outputs.skip != 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        if: steps.migration_guard.outputs.skip != 'true'
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 30 \
            --output /dev/null \
            --write-out 'Production health check: HTTP %{http_code}\n' \
            https://taleswithoutend.com
