name: Diagnose Production Campaign Loading

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/diagnose-campaign-production.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only production diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm repository production target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const database = config.d1_databases?.find((entry) => entry.binding === "DB");
          if (!database) throw new Error("DB binding is missing from wrangler.jsonc.");
          console.log(JSON.stringify({
            workerName: config.name,
            binding: database.binding,
            databaseName: database.database_name,
            databaseId: database.database_id,
          }, null, 2));
          NODE

      - name: Inspect active Worker deployment
        run: npx wrangler deployments status --name wwn-character-sheet --config wrangler.jsonc --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inspect exact production D1 schema and failing query
        shell: bash
        run: |
          set -euo pipefail
          wrangler="./node_modules/.bin/wrangler"
          database="wwn-character-sheet-db"
          config="wrangler.jsonc"

          run_query() {
            local label="$1"
            local sql="$2"
            echo "::group::${label}"
            "${wrangler}" d1 execute "${database}" --remote --config "${config}" --json --command "${sql}"
            echo "::endgroup::"
          }

          echo "::group::Production D1 identity"
          "${wrangler}" d1 info "${database}" --config "${config}" --json
          echo "::endgroup::"

          run_query "Migration state" "SELECT id, name, applied_at FROM d1_migrations ORDER BY id"
          run_query "Campaign columns" "PRAGMA table_info('campaigns')"
          run_query "Campaign table definition" "SELECT name, sql FROM sqlite_schema WHERE type = 'table' AND name = 'campaigns'"
          run_query "Campaign resource columns" "PRAGMA table_info('campaign_resources')"
          run_query "Campaign resource table definition" "SELECT name, sql FROM sqlite_schema WHERE type = 'table' AND name = 'campaign_resources'"
          run_query "Campaign resource indexes" "PRAGMA index_list('campaign_resources')"
          run_query "Campaign resource index definitions" "SELECT name, sql FROM sqlite_schema WHERE type = 'index' AND tbl_name = 'campaign_resources' ORDER BY name"
          run_query "Campaign resource foreign keys" "PRAGMA foreign_key_list('campaign_resources')"
          run_query "Schema-only aggregate verification" "SELECT (SELECT COUNT(*) FROM campaigns) AS campaignCount, (SELECT COUNT(*) FROM campaign_resources) AS resourceCount, (SELECT COUNT(*) FROM campaigns WHERE description IS NULL OR trim(description) = '') AS emptyDescriptionCount"
          run_query "Exact empty-resource query used by production" "SELECT id, title, type, content, position, updated_at AS updatedAt FROM campaign_resources WHERE campaign_id = '__production_schema_probe__' ORDER BY position ASC, created_at ASC"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
