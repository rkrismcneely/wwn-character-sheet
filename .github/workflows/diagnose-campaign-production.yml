name: Repair Production Campaign Resources

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/diagnose-campaign-production.yml"

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  repair:
    name: Apply and verify migration 0008
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repair commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply only the reviewed campaign resources migration
        run: node scripts/migrate-phase4c-resources.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify exact production schema and resource query
        shell: bash
        run: |
          set -euo pipefail
          wrangler="./node_modules/.bin/wrangler"
          database="wwn-character-sheet-db"
          config="wrangler.jsonc"

          run_query() {
            local label="$1"
            local sql="$2"
            echo "::group::${label}"
            "${wrangler}" d1 execute "${database}" --remote --config "${config}" --json --command "${sql}"
            echo "::endgroup::"
          }

          echo "::group::Production D1 identity"
          "${wrangler}" d1 info "${database}" --config "${config}" --json
          echo "::endgroup::"

          run_query "Migration state" "SELECT id, name, applied_at FROM d1_migrations ORDER BY id"
          run_query "Campaign columns" "PRAGMA table_info('campaigns')"
          run_query "Campaign resource columns" "PRAGMA table_info('campaign_resources')"
          run_query "Campaign resource table definition" "SELECT name, sql FROM sqlite_schema WHERE type = 'table' AND name = 'campaign_resources'"
          run_query "Campaign resource indexes" "SELECT name, sql FROM sqlite_schema WHERE type = 'index' AND tbl_name = 'campaign_resources' ORDER BY name"
          run_query "Campaign resource foreign keys" "PRAGMA foreign_key_list('campaign_resources')"
          run_query "Exact production list query" "SELECT id, title, type, content, position, updated_at AS updatedAt FROM campaign_resources WHERE campaign_id = '__production_schema_probe__' ORDER BY position ASC, created_at ASC"
          run_query "Production aggregate integrity" "SELECT (SELECT COUNT(*) FROM campaigns) AS campaignCount, (SELECT COUNT(*) FROM campaign_members) AS memberCount, (SELECT COUNT(*) FROM campaign_characters) AS characterLinkCount, (SELECT COUNT(*) FROM campaign_resources) AS resourceCount"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 30 \
            --output /dev/null \
            --write-out 'Production health check: HTTP %{http_code}\n' \
            https://taleswithoutend.com
