name: Bootstrap Recap Encryption (one time)

on:
  push:
    branches: [main]
    paths:
      - "scripts/ensure-recap-encryption-secret.mjs"
      - ".github/workflows/ensure-recap-encryption-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cannot race the existing production Worker deployment or other recap migrations.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Ensure production recap encryption
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Create secret only if completely absent
        run: node scripts/ensure-recap-encryption-secret.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify site availability
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 30 --output /dev/null --write-out 'Site health: HTTP %{http_code}\n' https://taleswithoutend.com
