name: Migrate and Deploy Action Bundle 13 NPC Inventory

on:
  push:
    branches: [main]
    paths:
      - "drizzle/0018_action_bundle_13_npc_inventory.sql"
      - "scripts/migrate-action-bundle-13-npc-inventory.mjs"
      - ".github/workflows/migrate-action-bundle-13-npc-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply and verify Action Bundle 13 NPC inventory migration
        run: node scripts/migrate-action-bundle-13-npc-inventory.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - name: Deploy production Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health
        run: curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 15 --max-time 30 --output /dev/null --write-out 'Production health check: HTTP %{http_code}\n' https://taleswithoutend.com
