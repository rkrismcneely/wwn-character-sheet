name: Migrate and Deploy Session Recaps

on:
  push:
    branches: [main]
    paths:
      - "drizzle/0032_campaign_session_recaps.sql"
      - "drizzle/0033_recap_recording_foundation.sql"
      - "drizzle/0034_recap_processing_jobs.sql"
      - "drizzle/0035_recap_user_audio_storage.sql"
      - "drizzle/0036_recap_storage_oauth_states.sql"
      - "drizzle/0047_recap_private_drafts.sql"
      - "drizzle/0048_recap_only_automation.sql"
      - "drizzle/0049_recap_explicit_confirmation.sql"
      - "drizzle/0050_recap_gemini_resumable_staging.sql"
      - "drizzle/0051_recap_repeatable_summary_jobs.sql"
      - "drizzle/0040_recap_ai_connections.sql"
      - "drizzle/0041_recap_gemini_background_jobs.sql"
      - "drizzle/0042_recap_gemini_drive_staging.sql"
      - "drizzle/0043_recap_gemini_source_verification.sql"
      - "drizzle/0044_recap_gemini_interaction_polls.sql"
      - "drizzle/0045_recap_gemini_fragment_assembly.sql"
      - "drizzle/0046_recap_gemini_submitted_state.sql"
      - "scripts/migrate-session-recaps.mjs"
      - "scripts/migrate-recap-imports.mjs"
      - "scripts/migrate-recap-processing.mjs"
      - "scripts/migrate-recap-audio-storage.mjs"
      - "scripts/migrate-recap-storage-oauth.mjs"
      - "scripts/migrate-recap-private-drafts.mjs"
      - "scripts/migrate-recap-only-automation.mjs"
      - "scripts/migrate-recap-manual-confirmation.mjs"
      - "scripts/migrate-recap-resumable-staging.mjs"
      - "scripts/migrate-recap-repeatable-jobs.mjs"
      - "scripts/migrate-recap-gemini-schema.mjs"
      - ".github/workflows/migrate-session-recaps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply and verify session recap D1 migration
        run: node scripts/migrate-session-recaps.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify recording import foundation D1 migration
        run: node scripts/migrate-recap-imports.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify recap processing D1 migration
        run: node scripts/migrate-recap-processing.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify GM-owned audio storage D1 migration
        run: node scripts/migrate-recap-audio-storage.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify user-bound Drive OAuth state migration
        run: node scripts/migrate-recap-storage-oauth.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify Gemini recap provider schema
        run: node scripts/migrate-recap-gemini-schema.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify private recording recap draft migration
        run: node scripts/migrate-recap-private-drafts.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify GM-consented recap-only job schema
        run: node scripts/migrate-recap-only-automation.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify explicit per-recording recap approval
        run: node scripts/migrate-recap-manual-confirmation.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply and verify resumable Gemini audio staging
        run: node scripts/migrate-recap-resumable-staging.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply versioned recap job history migration
        run: node scripts/migrate-recap-repeatable-jobs.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - name: Deploy production Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 15 --max-time 30 --output /dev/null --write-out 'Production health check: HTTP %{http_code}\n' https://taleswithoutend.com
