name: Finalize Phase 4B integration

on:
  pull_request:
    branches:
      - phase-4b-better-auth

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4b-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Apply reviewed reconciliation and hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ffe638733ccc3de3fa7645b2ec19768e232a167c"
          git config user.name 'phase4b-preproduction-review'
          git config user.email 'phase4b-preproduction-review@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              assert count == 1, f"{label}: expected one match, found {count}"
              return text.replace(old, new, 1)

          # Reconcile CSS block boundary and modestly enlarge only the title text.
          css = Path("app/globals.css")
          text = css.read_text()
          text = replace_once(
              text,
              "  .character-sharing select{min-width:0;width:100%}\n\n\n/* Tales Without End header mark:",
              "  .character-sharing select{min-width:0;width:100%}\n}\n\n/* Tales Without End header mark:",
              "Phase 4B/branding media boundary",
          )
          text = replace_once(text, "  font-size:21px;", "  font-size:24px;", "desktop title size")
          text = replace_once(
              text,
              "  .brand strong{font-size:15px;letter-spacing:.04em}",
              "  .brand strong{font-size:17px;letter-spacing:.04em}",
              "tablet title size",
          )
          text = replace_once(
              text,
              "  .brand strong{font-size:14px;letter-spacing:.02em}",
              "  .brand strong{font-size:16px;letter-spacing:.02em}",
              "phone title size",
          )
          css.write_text(text)

          # Harden administrative claim creation: reserve the only raw token first.
          claim = Path("scripts/create-legacy-claim.mjs")
          text = claim.read_text()
          section = text.index("const statements =")
          execute = 'executeD1(statements.join("\\n"), remote);'
          execute_index = text.index(execute, section)
          write_index = text.index("writeFileSync(", execute_index)
          log_index = text.index("console.log(`Claim created.", write_index)
          assert execute_index < write_index < log_index
          write_block = text[write_index:log_index]
          try_block = '''try {\n  executeD1(statements.join("\\n"), remote);\n} catch (error) {\n  console.error(\n    `Claim database creation failed after reserving ${outputPath}. Keep this file private and verify or revoke claim ID ${claimId} before retrying.`,\n  );\n  throw error;\n}\n'''
          text = text[:execute_index] + write_block + try_block + text[log_index:]
          claim.write_text(text)

          # Exercise the complete repository migration set in preservation testing.
          migration = Path("tests/phase4b-migration.test.mjs")
          text = migration.read_text()
          marker = '  runWrangler(persistTo, environment, ["--file", resolve(projectRoot, "drizzle/0002_character_ownership_and_claims.sql")]);\n'
          text = replace_once(
              text,
              marker,
              marker
              + '  runWrangler(persistTo, environment, ["--file", resolve(projectRoot, "drizzle/0003_better_auth_rate_limit_compatibility.sql")]);\n'
              + '  runWrangler(persistTo, environment, ["--file", resolve(projectRoot, "drizzle/0004_better_auth_verification_camel_case_compatibility.sql")]);\n',
              "migration sequence",
          )
          text = replace_once(text, '    "rate_limit",\n', '    "rate_limit",\n    "rateLimit",\n', "compatibility table list")
          before = '''  assert.throws(() => runWrangler(persistTo, environment, [\n    "--command",\n    "UPDATE characters SET visibility = 'friends-only' WHERE id = 'legacy-internal-id'",\n  ]));\n'''
          compatibility = '''  const compatibilityColumns = {\n    user: ["emailVerified", "createdAt", "updatedAt"],\n    session: ["expiresAt", "createdAt", "updatedAt", "ipAddress", "userAgent", "userId"],\n    account: ["accountId", "providerId", "userId", "accessToken", "refreshToken", "idToken", "accessTokenExpiresAt", "refreshTokenExpiresAt", "createdAt", "updatedAt"],\n    verification: ["expiresAt", "createdAt", "updatedAt"],\n    rateLimit: ["lastRequest"],\n  };\n  for (const [table, expectedColumns] of Object.entries(compatibilityColumns)) {\n    const columns = results(runWrangler(persistTo, environment, [\n      "--command",\n      `PRAGMA table_info('${table}')`,\n    ])).map(row => row.name);\n    for (const column of expectedColumns) {\n      assert.ok(columns.includes(column), `${table}.${column} should exist after compatibility migrations`);\n    }\n  }\n\n'''
          text = replace_once(text, before, compatibility + before, "compatibility column checks")
          migration.write_text(text)

          # Add focused reconciliation/security tests without disturbing the existing suites.
          Path("tests/phase4b-reconciliation.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { resolve } from "node:path";
          import test from "node:test";

          const root = resolve(new URL("..", import.meta.url).pathname);
          const source = path => readFile(resolve(root, path), "utf8");

          test("Tales Without End branding survives Phase 4B reconciliation", async () => {
            const [page, layout, css] = await Promise.all([
              source("app/page.tsx"),
              source("app/layout.tsx"),
              source("app/globals.css"),
            ]);
            assert.match(page, /tales-without-end-navigation-logo\.svg/u);
            assert.match(page, /<strong>Tales Without End<\/strong>/u);
            assert.doesNotMatch(page, /<strong>WORLDS WITHOUT NUMBER<\/strong>/u);
            assert.doesNotMatch(page, /Interactive character folio<\/small>/u);
            assert.match(page, /authClient\.signIn\.social/u);
            assert.match(page, /authClient\.signOut/u);
            assert.match(layout, /metadataBase: new URL\(CANONICAL_ORIGIN\)/u);
            assert.match(layout, /title: "Tales Without End - An Interactive Worlds Without Number Character Folio"/u);
            assert.match(css, /\.brand-logo\{[\s\S]*width:72px;[\s\S]*height:42px/u);
            assert.match(css, /\.brand strong\{\n  font-size:24px;\n  font-weight:600;\n  letter-spacing:\.06em;\n  white-space:nowrap;\n\}/u);
            assert.match(css, /\.brand strong\{font-size:17px;letter-spacing:\.04em\}/u);
            assert.match(css, /\.brand strong\{font-size:16px;letter-spacing:\.02em\}/u);
            assert.match(css, /html\{[^}]*overflow-x:hidden/u);
            assert.match(css, /body\{[^}]*overflow-x:hidden/u);
          });

          test("legacy claim creation preserves recovery material before D1 mutation", async () => {
            const claim = await source("scripts/create-legacy-claim.mjs");
            const section = claim.slice(claim.indexOf("const statements ="));
            const writeIndex = section.indexOf("writeFileSync(");
            const executeIndex = section.indexOf('executeD1(statements.join("\\n"), remote)');
            assert.ok(writeIndex >= 0 && executeIndex > writeIndex);
            assert.match(section, /flag: "wx", mode: 0o600/u);
            assert.match(section, /Claim database creation failed after reserving/u);
            assert.doesNotMatch(section, /console\.log\(\s*token\s*\)/u);
          });
          '''.replace("          ", ""))

          # README: make current migration inventory and rollout doc discoverable.
          readme = Path("README.md")
          text = readme.read_text()
          if "0003_better_auth_rate_limit_compatibility.sql" not in text:
              anchor = "- `0002_character_ownership_and_claims.sql` — additive character ownership,\n  visibility, public-ID, portrait-key, and legacy-claim schema\n"
              addition = anchor + "- `0003_better_auth_rate_limit_compatibility.sql` — additive historical\n  `rateLimit` / `lastRequest` compatibility table\n- `0004_better_auth_verification_camel_case_compatibility.sql` — additive\n  historical camel-case compatibility columns; current runtime mappings use\n  the canonical snake-case Better Auth fields\n"
              text = replace_once(text, anchor, addition, "README migration inventory")
          if "authoritative Phase 4B production order" not in text:
              marker = "Production migration is intentionally separate from deployment:\n"
              text = replace_once(
                  text,
                  marker,
                  "The authoritative Phase 4B production order, verification queries, claim setup, and rollback commands are in `docs/PHASE-4B-PRODUCTION-ROLLOUT.md`.\n\n" + marker,
                  "README rollout pointer",
              )
          text = text.replace(
              "stores only its SHA-256 hash in D1, and\n   writes the raw token once to a new mode-`0600` file.",
              "reserves the raw token first in a new mode-`0600` file and stores only its SHA-256 hash in D1. If the D1 result is ambiguous, retain that private file and verify/revoke its claim ID before retrying.",
          )
          if "npm run workers:types\n```" not in text:
              text = text.replace("npm run validate:artifact\n```", "npm run validate:artifact\nnpm run workers:types\n```", 1)
          if "docs/PHASE-4B-PRODUCTION-ROLLOUT.md` — authoritative" not in text:
              marker = "- `docs/phase-4b-review.md` — migration and security review material plus the\n  production verification checklist\n"
              text = replace_once(text, marker, marker + "- `docs/PHASE-4B-PRODUCTION-ROLLOUT.md` — authoritative pre-production audit and exact guarded rollout/rollback checklist\n", "README project layout")
          readme.write_text(text)

          # Checkpoint: promote the user-confirmed credentialed auth loop and completed reconciliation.
          checkpoint = Path("docs/PHASE-4B-CHECKPOINT.md")
          text = checkpoint.read_text()
          resume = "**Resume date:** 2026-08-10\n"
          if "**Current verified auth baseline before reconciliation:**" not in text:
              text = replace_once(
                  text,
                  resume,
                  resume + "**Current verified auth baseline before reconciliation:** `adc492927d1e1ba608beaa04c4afb791e1820bac`  \n**Current `main` branding head reconciled:** `30890ee9c3d314103ac71d5c12fab1d325f9a2be`\n",
                  "checkpoint heads",
              )
          text = text.replace(
              "This document remains the restart point for Phase 4B. Local Google sign-in and sign-out are now verified.",
              "This document remains the restart point for Phase 4B. The complete credentialed local Google sign-in → callback → authenticated UI → sign-out → refresh-signed-out → sign-in-again loop is verified on `adc492927d1e1ba608beaa04c4afb791e1820bac`.",
              1,
          )
          proof_start = text.index("Current isolated runtime proof uses dummy local Google credentials")
          branding_start = text.index("### Branding reconciliation note", proof_start)
          proof = "After `adc4929`, manual testing with the real ignored local Google credentials completed the full Google login/callback/authenticated-return/sign-out/refresh/sign-in-again loop successfully. The reconciliation changes branding, documentation, migration coverage, and the administrative claim-creation failure path; it does not replace the verified Better Auth sign-in/sign-out/session handlers. Another credentialed Google login is not required unless automated auth/runtime checks expose a regression.\n\n"
          text = text[:proof_start] + proof + text[branding_start:]
          branding_start = text.index("### Branding reconciliation note")
          gates_start = text.index("## Production gates still outstanding", branding_start)
          branding = """### Branding reconciliation completed\n\nCurrent `main` branding through `30890ee9c3d314103ac71d5c12fab1d325f9a2be` is merged hunk-by-hunk into the Phase 4B integration history. `app/page.tsx` keeps `/assets/tales-without-end-navigation-logo.svg`, the `Tales Without End` header text, and all Phase 4B auth/ownership UI. `app/layout.tsx` keeps Phase 4B canonical/Open Graph metadata while using the exact browser title `Tales Without End - An Interactive Worlds Without Number Character Folio`. `app/globals.css` keeps both Phase 4B account/library/share rules and current responsive logo sizes. The requested title revision is 21/15/14px → 24/17/16px while retaining font weight, letter spacing, logo sizes, alignment, and no-wrap behavior.\n\nThe migration/backfill/claim/authorization/privacy audit and exact future production command order are in `docs/PHASE-4B-PRODUCTION-ROLLOUT.md`. The key rollout effect remains deliberate: after `0002`, pre-account characters are private and unowned until explicitly claimed. Claim creation now reserves its private recovery token file before the administrative D1 mutation.\n\n"""
          text = text[:branding_start] + branding + text[gates_start:]
          text = text.replace("complete the production checklist in `docs/phase-4b-review.md`.", "complete the authoritative production checklist in `docs/PHASE-4B-PRODUCTION-ROLLOUT.md`.", 1)
          checkpoint.write_text(text)

          # Keep the older long review as historical detail while pointing execution to the current audit.
          review = Path("docs/phase-4b-review.md")
          text = review.read_text()
          status = "Status: feature branch review only. The production migration has **not** been\napplied and this branch must not be merged without approval.\n"
          if "2026-08-10 reconciliation note" not in text:
              text = replace_once(
                  text,
                  status,
                  status + "\n> **2026-08-10 reconciliation note:** the current repository migration inventory is `0000` through `0004`. The authoritative production command order, verification queries, claim preparation, and rollback procedure are in `docs/PHASE-4B-PRODUCTION-ROLLOUT.md`. Older wording below that refers only to `0001`/`0002` is historical context, not an execution checklist.\n",
                  "review reconciliation note",
              )
          if "### `drizzle/0003_better_auth_rate_limit_compatibility.sql`" not in text:
              marker = "## Tables and indexes\n"
              compat = """### `drizzle/0003_better_auth_rate_limit_compatibility.sql`\n\nAdditive historical compatibility table `rateLimit` with camel-case `lastRequest`; current Better Auth runtime mapping uses canonical `rate_limit.last_request`.\n\n### `drizzle/0004_better_auth_verification_camel_case_compatibility.sql`\n\nAdditive historical camel-case compatibility columns/backfills on `user`, `session`, `account`, and `verification`; current Better Auth runtime mapping uses the canonical snake-case columns.\n\n"""
              text = replace_once(text, marker, compat + marker, "review compatibility migrations")
          text = text.replace("applying `0001` and `0002`.", "applying the reviewed pending set (`0001`–`0004`).", 1)
          text = text.replace("apply the two production\n  migrations", "apply the reviewed pending production\n  migrations", 1)
          review.write_text(text)

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text()
          old = "**Status: In progress — the full local Google sign-in → callback → authenticated UI → sign-out → refresh-signed-out → sign-in-again loop is verified on `adc492927d1e1ba608beaa04c4afb791e1820bac`. Pre-production reconciliation and review are in progress; production migration, backfill/claims, deployment, and merging remain blocked pending explicit approval. See `docs/PHASE-4B-CHECKPOINT.md`.**"
          new = "**Status: In progress — the full local Google sign-in → callback → authenticated UI → sign-out → refresh-signed-out → sign-in-again loop is verified on `adc492927d1e1ba608beaa04c4afb791e1820bac`. Current Tales Without End branding is reconciled and the pre-production code/migration/security review is complete. Production migration, backfill/claims, deployment, and merging remain blocked pending explicit approval. See `docs/PHASE-4B-CHECKPOINT.md` and `docs/PHASE-4B-PRODUCTION-ROLLOUT.md`.**"
          text = replace_once(text, old, new, "roadmap Phase 4B status")
          roadmap.write_text(text)
          PY

          git diff --check
          test -z "$(git grep -n '^<<<<<<<\|^=======\|^>>>>>>>' -- ROADMAP.md README.md app docs scripts tests || true)"
          grep -Fq '/assets/tales-without-end-navigation-logo.svg' app/page.tsx
          grep -Fq 'Tales Without End - An Interactive Worlds Without Number Character Folio' app/layout.tsx
          grep -Fq 'authClient.signIn.social' app/page.tsx
          grep -Fq 'authClient.signOut' app/page.tsx
          grep -Fq 'font-size:24px' app/globals.css
          grep -Fq 'drizzle/0004_better_auth_verification_camel_case_compatibility.sql' tests/phase4b-migration.test.mjs
          grep -Fq 'Claim database creation failed after reserving' scripts/create-legacy-claim.mjs
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Full test suite
        run: npm test
      - name: Worker binding types
        run: npm run workers:types
      - name: Commit verified integration changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add ROADMAP.md README.md app/globals.css docs/PHASE-4B-CHECKPOINT.md docs/phase-4b-review.md scripts/create-legacy-claim.mjs tests/phase4b-migration.test.mjs tests/phase4b-reconciliation.test.mjs
          git diff --check --cached
          git commit -m 'Complete Phase 4B pre-production reconciliation review'
          git push origin HEAD:agent/phase-4b-integration
