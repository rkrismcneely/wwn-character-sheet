name: PR 159 parameterized Art choices

on:
  push:
    branches:
      - fix/mandatory-class-selections

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mandatory-class-selections
          fetch-depth: 0

      - name: Apply parameterized Art choices
        run: python scripts/pr159-art-choice-step.py

      - name: Verify focused implementation
        run: |
          npm ci
          npm run typecheck
          node --experimental-strip-types --test tests/character-creation.test.mjs tests/level-one-creation-audit.test.mjs tests/level-advancement.test.mjs

      - name: Commit implementation
        run: |
          rm .github/workflows/pr159-art-choice-step.yml scripts/pr159-art-choice-step.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record required parameterized Art choices"
          git push origin HEAD:fix/mandatory-class-selections
