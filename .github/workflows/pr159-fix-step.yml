name: PR 159 focused repair

on:
  push:
    branches:
      - fix/mandatory-class-selections

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mandatory-class-selections
          fetch-depth: 0

      - name: Apply focused repairs
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/character-creation.test.mjs",
              'focusPicks: ["Alert", "Armsmaster", "Die Hard"].map((name) => ({',
              'focusPicks: ["Alert", "Cultured", "Die Hard"].map((name) => ({',
          )
          replace_once(
              "tests/character-creation.test.mjs",
              'focusPicks: ["Alert", "Armsmaster"].map((name) => ({ name, level: 1 })),',
              'focusPicks: ["Alert", "Cultured"].map((name) => ({ name, level: 1 })),',
          )
          replace_once(
              "tests/character-creation.test.mjs",
              '  assert.match(sheet, /Physical d\\{dieSize\\} result/u);\n',
              '  assert.match(sheet, /Physical d\\{dieSize\\} result/u);\n  assert.match(wizard, /Wise concept skill[\\s\\S]*creationSkills\\.map/u);\n  assert.match(sheet, /wiseConceptSkill: skills\\.includes/u);\n',
          )
          replace_once(
              "tests/level-one-creation-audit.test.mjs",
              '    if (status.focusPicksUsed === status.allowedFocusPicks && status.stepStatus.foci.complete)\n      return state;',
              '    if (status.focusPicksUsed >= status.allowedFocusPicks) return state;',
          )
          replace_once(
              "app/character-sheet.tsx",
              '    wiseConceptSkill: noncombatSkills.includes(stored.wiseConceptSkill || "") ? stored.wiseConceptSkill! : "",',
              '    wiseConceptSkill: skills.includes(stored.wiseConceptSkill || "") ? stored.wiseConceptSkill! : "",',
          )
          replace_once(
              "app/character-creation-wizard.tsx",
              '''            {status.selectedClasses.includes("Wise") && (\n              <label>\n                <span>Wise concept skill</span>\n                <select\n                  value={sheet.wiseConceptSkill}\n                  onChange={(event) =>\n                    change({ wiseConceptSkill: event.target.value })\n                  }\n                >\n                  <option value="">Choose…</option>\n                  {creationNoncombatSkills.map((name) => (''',
              '''            {status.selectedClasses.includes("Wise") && (\n              <label>\n                <span>Wise concept skill</span>\n                <select\n                  value={sheet.wiseConceptSkill}\n                  onChange={(event) =>\n                    change({ wiseConceptSkill: event.target.value })\n                  }\n                >\n                  <option value="">Choose…</option>\n                  {creationSkills.map((name) => (''',
          )

          # The workflow is only a transport for this focused repair; do not leave it in the PR.
          Path(".github/workflows/pr159-fix-step.yml").unlink()
          PY

      - name: Verify focused tests
        run: |
          npm ci
          node --experimental-strip-types --test tests/character-creation.test.mjs tests/level-one-creation-audit.test.mjs

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/character-sheet.tsx app/character-creation-wizard.tsx tests/character-creation.test.mjs tests/level-one-creation-audit.test.mjs .github/workflows/pr159-fix-step.yml
          git commit -m "Repair class-choice fixtures and Wise skill UI"
          git push origin HEAD:fix/mandatory-class-selections
