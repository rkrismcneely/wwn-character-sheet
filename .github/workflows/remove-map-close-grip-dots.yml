name: Remove Map Close Grip Dots

on:
  push:
    branches:
      - fix/map-close-handle-resize
    paths:
      - scripts/remove-map-close-grip-dots.mjs
      - .github/workflows/remove-map-close-grip-dots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-close-handle-resize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Remove grip dots
        run: node scripts/remove-map-close-grip-dots.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused drawer tests
        run: node --experimental-strip-types --test tests/campaign-map-drawer.test.mjs
      - name: Full repository tests
        run: npm test
      - name: Build production artifact
        run: npm run build
      - name: Validate Worker artifact
        run: npm run validate:artifact
      - name: Commit validated cleanup
        run: |
          git checkout -- scripts/remove-map-close-grip-dots.mjs .github/workflows/remove-map-close-grip-dots.yml
          if git diff --quiet; then
            echo "No implementation changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/campaigns/campaign-map-launcher.tsx app/campaigns/campaign-map.css tests/campaign-map-drawer.test.mjs
          git commit -m "Remove decorative dots from Close Map resize handle"
          git push origin HEAD:fix/map-close-handle-resize
