name: Ship approved PRs after CI

# Trusted same-repository presentation PRs ship automatically after CI.
# Sensitive changes still require the ship-when-green label.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  merge:
    name: Merge validated release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge only approved, unchanged and validated PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          PRS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$PRS_JSON" | jq -r '.[].number' | while read -r number; do
            [ -n "$number" ] || continue
            pr=$(gh api "repos/$GH_REPO/pulls/$number")
            state=$(jq -r '.state' <<< "$pr")
            base=$(jq -r '.base.ref' <<< "$pr")
            head=$(jq -r '.head.sha' <<< "$pr")
            association=$(jq -r '.author_association' <<< "$pr")
            labels=$(jq -r '[.labels[].name] | index("ship-when-green") != null' <<< "$pr")
            source_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pr")
            files=$(gh api --paginate "repos/$GH_REPO/pulls/$number/files?per_page=100" --jq '.[].filename')
            routine=true
            if [ -z "$files" ]; then routine=false; fi
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                app/campaigns/campaign-map-*.tsx|app/campaigns/map-*.tsx|app/campaigns/campaign-map.css|app/campaigns/campaign-ui.css|app/globals.css|public/*|*.md|docs/*) ;;
                *) routine=false ;;
              esac
            done <<< "$files"
            # Only repository collaborators' PRs with explicit opt-in are eligible.
            if [ "$state" != open ] || [ "$base" != main ] || [ "$head" != "$RUN_SHA" ] ||
               [ "$source_repo" != "$GH_REPO" ]; then continue; fi
            case "$association" in OWNER|MEMBER|COLLABORATOR) ;; *) continue ;; esac
            if [ "$labels" != true ] && [ "$routine" != true ]; then continue; fi
            # GitHub applies branch protection/rulesets at merge time.
            gh pr merge "$number" --repo "$GH_REPO" --squash --delete-branch
            # GITHUB_TOKEN merges do not emit ordinary push workflows.
            # Dispatch the guarded deployment explicitly instead.
            gh workflow run deploy-ci-artifact.yml --repo "$GH_REPO" --ref main \
              -f pr_number="$number" -f ci_run_id="$CI_RUN_ID"
          done
