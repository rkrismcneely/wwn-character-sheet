name: Temporary Repeat Spell Casting Patch

on:
  push:
    branches:
      - fix/repeat-spell-casting-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/repeat-spell-casting-20260914
      - name: Apply focused source patch
        run: node scripts/apply-repeat-spell-casting.mjs
      - name: Commit patched character sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/character-sheet.tsx
          git diff --cached --exit-code && { echo "No character-sheet changes were produced"; exit 1; }
          git commit -m "Support repeat spell casting counters"
          git push origin HEAD:fix/repeat-spell-casting-20260914
