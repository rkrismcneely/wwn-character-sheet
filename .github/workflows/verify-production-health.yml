name: Verify production availability

# Cloudflare Git Integration owns normal production deployment. This checks
# reachability after main changes; it does not falsely claim SHA parity.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  smoke:
    name: Production health
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Confirm exact merged commit is live
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Cloudflare Git Integration publishes asynchronously. Poll its
          # static build marker rather than accepting a healthy older release.
          for attempt in $(seq 1 45); do
            status=$(curl --silent --show-error --location --connect-timeout 10 \
              --max-time 15 --output /tmp/twe-version \
              --write-out '%{http_code}' \
              "https://taleswithoutend.com/twe-build-version.json?check=$EXPECTED_SHA" || true)
            actual=$(jq -r '.commit // empty' /tmp/twe-version 2>/dev/null || true)
            if [ "$status" = 200 ] && [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "Verified live release: $actual"
              curl --fail --silent --show-error --location --max-time 20 \
                --output /dev/null https://taleswithoutend.com/
              # A healthy homepage is not enough: this endpoint returned 503
              # while previous releases were otherwise considered healthy.
              curl --fail --silent --show-error --location --max-time 20 \
                --dump-header /tmp/twe-ffmpeg-worker-headers \
                --output /tmp/twe-ffmpeg-worker \
                "https://taleswithoutend.com/api/recap-ffmpeg/worker.js?release=$EXPECTED_SHA"
              grep -qi '^content-type: *text/javascript' /tmp/twe-ffmpeg-worker-headers
              grep -q 'self.onmessage' /tmp/twe-ffmpeg-worker
              grep -q 'case "LOAD"' /tmp/twe-ffmpeg-worker
              echo "Verified FFmpeg worker endpoint and message protocol."
              # Prove an audio-sized POST can reach the AUTH gate before any
              # framework payload parser rejects it. Synthetic bytes only:
              # no user content, Gemini key, or paid-capable AI request.
              head -c 6291456 /dev/zero > /tmp/twe-recap-gateway-probe
              probe_status=$(curl --silent --show-error --connect-timeout 10 \
                --max-time 25 --output /tmp/twe-recap-gateway-result \
                --write-out '%{http_code}' --request POST \
                --header 'Origin: https://taleswithoutend.com' \
                --header 'Content-Type: application/octet-stream' \
                --data-binary @/tmp/twe-recap-gateway-probe \
                'https://taleswithoutend.com/api/campaigns/cmp_AAAAAAAAAAAAAAAAAAAAAA/session-recaps/transcript/gemini' || true)
              if [ "$probe_status" != 401 ] || ! grep -q '"Sign in required."' /tmp/twe-recap-gateway-result; then
                echo "Large transcription request failed to reach GM authorization (HTTP $probe_status)." >&2
                exit 1
              fi
              echo "Verified 6 MiB recap upload reaches authentication (without AI invocation)."
              exit 0
            fi
            echo "Waiting for Cloudflare to deploy $EXPECTED_SHA (observed ${actual:-none})."
            sleep 10
          done
          echo "Production did not confirm this commit. Check Cloudflare deployment status." >&2
          exit 1
