name: Verify Production Release
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: read
  statuses: write
concurrency:
  # Each merge must retain its own verification result; GitHub otherwise replaces
  # older pending runs in a shared concurrency group during rapid merges.
  group: verify-twe-production-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    name: Confirm live production version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish pending deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(process.env.API_URL+"/repos/"+process.env.REPO+"/statuses/"+process.env.SHA,{
            method:"POST",
            headers:{"Authorization":"Bearer "+process.env.GH_TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
            body:JSON.stringify({state:"pending",context:"TWE Production",description:"Checking Cloudflare production release",target_url:process.env.RUN_URL})
          });
          if(!response.ok)throw Error("Failed to set pending status: "+response.status);
          NODE
      - name: Wait for Cloudflare and verify live release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=90
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then max_attempts=1; fi
          for attempt in $(seq 1 "$max_attempts"); do
            if node scripts/verify-live-release.mjs "$EXPECTED_SHA"; then
              echo "### Production verified" >> "$GITHUB_STEP_SUMMARY"
              echo "Commit $EXPECTED_SHA is live on taleswithoutend.com." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A later merge may overtake this one; only accept verified descendants.
            live="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://taleswithoutend.com/twe-build-version.json?attempt=$attempt" 2>/dev/null | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const v=JSON.parse(s).commit;if(/^[a-f0-9]{40}$/.test(v))process.stdout.write(v)}catch{}})' || true)"
            if [[ "$live" =~ ^[a-f0-9]{40}$ && "$live" != "$EXPECTED_SHA" ]]; then
              git fetch --quiet origin main
              if git cat-file -e "$live^{commit}" 2>/dev/null && git merge-base --is-ancestor "$EXPECTED_SHA" "$live"; then
                if node scripts/verify-live-release.mjs "$live"; then
                  echo "### Production verified (superseded)" >> "$GITHUB_STEP_SUMMARY"
                  echo "Expected $EXPECTED_SHA; newer descendant $live is live and healthy." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              fi
            fi
            if (( attempt < max_attempts )); then sleep 10; fi
          done
          echo "### Production verification failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected $EXPECTED_SHA, but could not confirm it or a newer descendant on the healthy live site." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Publish readable commit deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          VERIFICATION_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const state = process.env.VERIFICATION_RESULT === "success" ? "success" : "failure";
          const description = state === "success"
            ? "Production release verified on taleswithoutend.com"
            : "Production release verification did not pass; inspect workflow run";
          const response = await fetch(process.env.API_URL+"/repos/"+process.env.REPO+"/statuses/"+process.env.SHA,{
            method:"POST",
            headers:{"Authorization":"Bearer "+process.env.GH_TOKEN,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},
            body:JSON.stringify({state,context:"TWE Production",description,target_url:process.env.RUN_URL})
          });
          if(!response.ok)throw Error("Unable to publish commit status: HTTP "+response.status);
          console.log("TWE Production commit status:",state);
          NODE
