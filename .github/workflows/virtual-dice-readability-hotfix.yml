name: Virtual Dice Readability Hotfix

on:
  push:
    branches:
      - fix/virtual-dice-readability
    paths:
      - scripts/virtual-dice-readability-hotfix.mjs
      - scripts/virtual-dice-readability-typefix.mjs
      - .github/workflows/virtual-dice-readability-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/virtual-dice-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply focused readability hotfix
        run: |
          node scripts/virtual-dice-readability-hotfix.mjs
          node scripts/virtual-dice-readability-typefix.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused dice tests
        run: node --experimental-strip-types --test tests/roll-ui.test.mjs tests/action-bundle-8-live-map-dice.test.mjs
      - name: Full repository tests
        run: npm test
      - name: Validate Worker artifact
        run: npm run validate:artifact
      - name: Commit validated hotfix
        run: |
          if git diff --quiet; then
            echo "Dice readability files already transformed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/virtual-dice-style.ts app/virtual-dice-adapter.ts tests/roll-ui.test.mjs
          git commit -m "Improve virtual dice readability and style identity"
          git push origin HEAD:fix/virtual-dice-readability
